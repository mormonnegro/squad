# The deployment's name, and the first word of everything it makes: this project, its two networks,
# and — through SQUAD_NAME reaching the plane — every container and volume an agent gets. Two of
# these on one machine share nothing but the Docker daemon. Left alone it is `squad`, which is what
# every install before this called them.
name: ${SQUAD_NAME:-squad}

services:
  control-plane:
    # Named so that the same file can run a published image or one built here, and so that a build
    # lands on the name the next `up` will look for. The default is the local name on purpose: an
    # install that was building from source before this existed keeps working untouched, and only an
    # installer that pulled writes a registry reference into .env.
    image: ${SQUAD_IMAGE:-squad/control-plane:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    labels:
      # How `squad` finds this container when it cannot open the socket directly, which is every
      # machine where Docker runs in a VM. The value is the state directory it serves.
      squad.state: ${SQUAD_STATE:-/var/lib/squad}
    volumes:
      # The daemon resolves bind sources on the host, so the path the control plane uses to mount
      # the CA into a sandbox has to mean the same thing in both places. Mounting the state
      # directory at its own name is what makes that true; a convenient container path would
      # produce mounts the daemon cannot find.
      #
      # A variable because /var/lib is a server's answer. Docker Desktop shares /Users and not that,
      # so a plane installed alongside the console keeps its state under $HOME, and the installer
      # writes the choice into .env where compose reads it.
      - ${SQUAD_STATE:-/var/lib/squad}:${SQUAD_STATE:-/var/lib/squad}
      # Sandboxes are containers, so managing them is root on the host. This is the trust boundary
      # of the whole system: the sandbox contains the agent, not this process.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.yaml:/etc/squad/config.yaml:ro
    environment:
      # Which image an agent runs inside. Here rather than in .env alone so that a plane started by
      # hand, with no installer in the room, still agrees with the one the installer started.
      SQUAD_SANDBOX_IMAGE: ${SQUAD_SANDBOX_IMAGE:-squad/sandbox:dev}
      # A rendezvous to dial out to, when the operator asked for one. Empty is the answer for every
      # plane that has not: nothing is opened either way, but a connection nobody asked for is one
      # nobody chose.
      SQUAD_RELAY: ${SQUAD_RELAY:-}
    ports:
      # Published on the same number on both sides on purpose. These ports are written into things
      # the plane hands out — a redirect URI, the address `squad web` prints — so a container port
      # that differed from the host's would make the plane name an address nobody can open.
      #
      # Webhooks, and the door a browser comes back through after an MCP login. The proxy stays on
      # the container networks, where the agents are, because publishing it would put a
      # credential-injecting forwarder on the internet.
      - "${SQUAD_HOOK_PORT:-8787}:${SQUAD_HOOK_PORT:-8787}"
      # Bound to loopback, because the only thing that should ever reach it is a browser on this
      # machine. `/mcp login` sends the operator to a consent screen that redirects to
      # localhost:8788, and without this the plane would be listening where nobody can knock.
      - "127.0.0.1:${SQUAD_OAUTH_PORT:-8788}:${SQUAD_OAUTH_PORT:-8788}"
      # The web console. Loopback by default and for a strong reason: this is the whole control
      # surface, and the plane holds the Docker socket.
      #
      # Which address it is published on is the installer's to decide, because the honest answer
      # differs by machine. On a laptop it is loopback and the way in from elsewhere is a forwarded
      # port. On a server with no name of its own there is nothing to forward from, so it is the
      # machine's own address — and then the token is the only thing between a stranger and these
      # agents, which is why the install says so out loud and prints the one line that puts a
      # certificate in front of it.
      - "${SQUAD_WEB_BIND:-127.0.0.1}:${SQUAD_WEB_PORT:-8789}:${SQUAD_WEB_PORT:-8789}"
    networks:
      egress:
        aliases:
          - egress
        priority: 0
      # Joined first, and that is load-bearing. A published port is forwarded to the address the
      # container had on its first network, and an internal network drops anything that did not
      # come from inside it, so joining egress first makes 8787 unreachable from the host.
      uplink:
        priority: 100

  # The plane on a name of its own, with a certificate it gets and renews by itself.
  #
  # Under a profile because it is the answer to one question — does this machine have a domain —
  # and a machine without one must not have port 80 taken by something waiting for a certificate
  # that will never come. `--profile tls` is what the installer adds when SQUAD_DOMAIN is set.
  #
  # It reaches the plane over the uplink network rather than through a published port, so the web
  # port stays bound to this host's loopback exactly as it was. Nothing about the plane's own
  # exposure changes by putting this in front of it: what is published here is the proxy.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the account key. A named volume because losing them means asking Let's
      # Encrypt for new ones on every restart, which is how a deployment meets a rate limit.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SQUAD_DOMAIN: ${SQUAD_DOMAIN:-}
      SQUAD_WEB_PORT: ${SQUAD_WEB_PORT:-8789}
    depends_on:
      - control-plane
    networks:
      - uplink

volumes:
  caddy-data:
  caddy-config:

networks:
  # Where the agents live. Internal really is unrouted: a container here cannot reach the host or
  # the internet by any address, so the only way out is the proxy, which is on this network too.
  egress:
    name: ${SQUAD_NAME:-squad}-egress
    internal: true
  # How the control plane reaches the internet on the agents' behalf.
  uplink:
    name: ${SQUAD_NAME:-squad}-uplink
