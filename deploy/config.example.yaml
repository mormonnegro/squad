# Every capability an agent has is in this file. Nothing here is a secret, so commit it and review
# changes to it: a grant nobody noticed being added is the whole failure mode.

stateDir: /var/lib/agent-dive

agents:
  - id: scout
    provider: anthropic
    model: claude-opus-4-7

    # Only used the first time the agent boots, to write its soul.md. After that the agent's
    # repository is the agent's, and this file stops having an opinion about who it is.
    description: Watches the issue tracker and answers questions about it.

    # What the sandbox gets in its environment. pi wants a key set, and this is not one: the model
    # grant below strips whatever the agent sends and writes the real key instead. Use `envFrom`
    # here — which names a variable of the control plane rather than quoting a value — only for
    # things the agent genuinely has to hold.
    env:
      ANTHROPIC_API_KEY: injected-by-the-proxy

    # What the agent may reach, and with whose credentials. The agent never sees the token: the
    # proxy attaches it after the request has matched a grant. `ref` names an environment variable
    # of the control plane.
    grants:
      # Without this the agent cannot think. It is a grant like any other, which is the point: the
      # model is somewhere the agent is allowed to reach, not somewhere it is trusted to spend.
      - id: model
        host: api.anthropic.com
        injection:
          kind: header
          name: x-api-key
          value: { ref: ANTHROPIC_API_KEY }

      - id: github-issues
        host: api.github.com
        pathPrefix: /repos/acme/website/issues
        methods: [GET, POST]
        injection:
          kind: bearer
          token: { ref: GITHUB_TOKEN }

      - id: docs
        host: "*.acme.com"
        methods: [GET]
        injection:
          kind: none

    schedules:
      - kind: cron
        expression: "0 9 * * 1-5"
        timeZone: America/Argentina/Buenos_Aires
        channel: cron:standup
        body: Summarise yesterday's issues and post the standup note.
        # An operator wrote this line, so the wakeup may instruct. Anything the agent schedules for
        # itself cannot carry operator trust, however it asks.
        trust: operator
        createdBy: operator

# An HMAC-signed endpoint at POST /hooks/<id> on port 8787.
hooks:
  - id: deploys
    agentId: scout
    # The name of an environment variable, not the secret itself.
    secretEnv: DEPLOY_HOOK_SECRET
    # A hook proves which system sent the request, never that a human meant what is inside it, so
    # operator trust is refused here. The default is "public".
    trust: participant
    replyUrl: https://acme.example.com/agent-replies
