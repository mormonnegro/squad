# Every capability an agent has is in this file. Nothing here is a secret, so commit it and review
# changes to it: a grant nobody noticed being added is the whole failure mode.

stateDir: /var/lib/agent-dive

# Everything the agents here may think with. Naming a provider is the whole of configuring it: where
# it lives, what its key is called and how the key is attached are facts about the provider, not
# decisions, so they are not written out. The key itself is never here — it is read from the named
# variable in this plane's own environment and written onto the request at the proxy, so no agent
# ever holds it.
#
# Every model in this list is reachable by every agent, which is what makes `/model` a choice rather
# than a grant: the console can move an agent between them because putting one here was the approval.
# What stops one agent thinking expensively is its ceiling, which is per agent and below.
models:
  # The id is the name to pick it by, and doubles as the model when it is already the model's name.
  - id: deepseek-v4-flash
    provider: deepseek

  # Anything whose name is not the model's says both. The key here is ANTHROPIC_API_KEY.
  - id: sonnet
    provider: anthropic
    model: claude-sonnet-4-6

  # A provider nothing here knows still works, by writing out the two things that were the table's:
  # where it lives, and what the variable holding its key is called.
  #
  # - id: local
  #   provider: my-gateway
  #   model: llama-4-70b
  #   host: models.acme.internal
  #   keyEnv: GATEWAY_TOKEN

# What every agent starts from, and the whole of what an agent made later is. `agent chat <name>`
# offers to create a name no agent answers to, and this is the operator's answer, given in advance,
# to what that agent may reach — because the one thing the keyboard may never do is grant.
#
# An agent's own block adds to these rather than replacing them; a grant it declares with the same
# id wins, which is how one agent is narrowed without narrowing the rest.
defaults:
  # One of the ids above. `/model` moves a single agent onto another without editing this file, and
  # what it says here is where every agent starts and where a new one begins.
  model: deepseek-v4-flash

  # US dollars a day, counted across every turn and reset at midnight UTC. An agent that books its
  # own next turn runs with nobody watching, so this is what decides how much a loop can cost before
  # somebody notices. Reaching it stops the agent taking turns and says so in its conversation; the
  # messages are not lost, and the next day it goes on. `/limit` in the console moves it for one
  # agent without editing this file — that is a ceiling, never a grant, which is why the keyboard
  # may touch it at all. Leave it out for no ceiling.
  limitUsd: 5

  grants:
    # How an agent reaches the web at all. Both the searching and the reading of what it finds happen
    # on the far side of this one host, which is the only reason "let it search" is a grant somebody
    # can write: an agent that fetched pages itself would need every domain a result might live on
    # named in advance. Drop this and the tool says so when used, rather than guessing an answer.
    #
    # Scoped to the endpoint that searches, because the same key against the rest of that API is a
    # second model to think with — bought by whoever takes the agent over.
    - id: search
      host: api.openai.com
      pathPrefix: /v1/responses
      methods: [POST]
      injection:
        kind: bearer
        token: { ref: OPENAI_API_KEY }

agents:
  # Everything above is already true of this agent. What is here is what makes it that one.
  - id: scout

    # Only used the first time the agent boots, to write its soul.md. After that the agent's
    # repository is the agent's, and this file stops having an opinion about who it is.
    description: Watches the issue tracker and answers questions about it.

    # What this one may reach on top of the defaults, and with whose credentials. The agent never
    # sees the token: the proxy attaches it after the request has matched a grant. `ref` names an
    # environment variable of the control plane.
    grants:
      - id: github-issues
        host: api.github.com
        pathPrefix: /repos/acme/website/issues
        methods: [GET, POST]
        injection:
          kind: bearer
          token: { ref: GITHUB_TOKEN }

      - id: docs
        host: "*.acme.com"
        methods: [GET]
        injection:
          kind: none

    # An MCP server the operator logged into needs nothing here. `/mcp login <name>` sends them to
    # that server's consent screen, and what comes back grants one host and that server's own path,
    # for as long as the agent holds the server. It is the only capability not in this file, and it
    # is allowed because a consent screen is a person approving a named host, which is a stronger
    # act than a line here rather than a weaker one. A server that wants no account is a grant like
    # any other, written above.

    schedules:
      - kind: cron
        expression: "0 9 * * 1-5"
        timeZone: America/Argentina/Buenos_Aires
        channel: cron:standup
        body: Summarise yesterday's issues and post the standup note.
        # An operator wrote this line, so the wakeup may instruct. Anything the agent schedules for
        # itself cannot carry operator trust, however it asks.
        trust: operator
        createdBy: operator

# An HMAC-signed endpoint at POST /hooks/<id> on port 8787.
hooks:
  - id: deploys
    agentId: scout
    # The name of an environment variable, not the secret itself.
    secretEnv: DEPLOY_HOOK_SECRET
    # A hook proves which system sent the request, never that a human meant what is inside it, so
    # operator trust is refused here. The default is "public".
    trust: participant
    replyUrl: https://acme.example.com/agent-replies
